<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FrostBound Bots</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="game.js"></script>
</head>
<body>
  <main>
    <h1>FrostBound Bots</h1>
    <p id="objective">Stop the target robot on its target tile.</p>
    <div class="layout">
      <div id="board" aria-label="8 × 8 board"></div>
      <section aria-label="Game controls">
        <p class="counter">Your Moves <strong id="moves">0</strong></p>
        <div id="robots" aria-label="Robot selection" role="group"></div>
        <div id="directions" aria-label="Movement directions" role="group">
          <button data-direction="up" aria-label="Up">↑</button>
          <button data-direction="left" aria-label="Left">←</button>
          <button data-direction="down" aria-label="Down">↓</button>
          <button data-direction="right" aria-label="Right">→</button>
        </div>
        <p class="help">Press 1–4 to select a robot and use the arrow keys to slide.</p>
        <button id="reset">Restart Round</button>
        <p id="status" role="status"></p>
      </section>
    </div>
  </main>
</body>
</html>
